name: Fetch datasets

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

concurrency:
  group: datasets-pages
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: [self-hosted, linux, x64, finance-vm]
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false
          submodules: recursive

      - name: Load and validate local runner env
        id: runner_env
        shell: bash
        run: |
          set -euo pipefail
          source /opt/datasets/runner-env.sh

          if [[ -z "${PYTHON_BIN:-}" ]]; then
            PYTHON_BIN=python3
          fi
          command -v "$PYTHON_BIN" >/dev/null 2>&1

          if [[ -z "${DATA_ROOT:-}" ]]; then
            DATA_ROOT="$GITHUB_WORKSPACE/data"
          fi
          if [[ ${EGOV_OUT_DIR+x} != x ]]; then
            EGOV_OUT_DIR=""
          fi
          if [[ ${LOCATION_OUT_DIR+x} != x ]]; then
            LOCATION_OUT_DIR=""
          fi
          if [[ ${CES_EXPORT_OUT_DIR+x} != x ]]; then
            CES_EXPORT_OUT_DIR=""
          fi
          if [[ -z "${LOCATION_DATA_DAYS_REFRESH:-}" ]]; then
            LOCATION_DATA_DAYS_REFRESH=30
          fi
          if [[ -z "${CES_CONFIG:-}" ]]; then
            CES_CONFIG="$GITHUB_WORKSPACE/ces-export/config/datasets.json"
          fi

          mkdir -p "$DATA_ROOT"

          if [[ -n "$CES_EXPORT_OUT_DIR" ]]; then
            : "${CES_ORG_NAME:?Missing CES_ORG_NAME (required when CES_EXPORT_OUT_DIR is enabled)}"
            : "${CES_SECRETS_DIR:?Missing CES_SECRETS_DIR (required when CES_EXPORT_OUT_DIR is enabled)}"

            sudo test -d "$CES_SECRETS_DIR"
            sudo test -f "$CES_SECRETS_DIR/APIKEY"
            sudo test -f "$CES_SECRETS_DIR/USER"
            sudo test -f "$CES_SECRETS_DIR/PASS"
            sudo test -f "$CES_SECRETS_DIR/URI"
            test -f "$CES_CONFIG"
          fi

          {
            echo "PYTHON_BIN=$PYTHON_BIN"
            echo "DATA_ROOT=$DATA_ROOT"
            echo "EGOV_OUT_DIR=$EGOV_OUT_DIR"
            echo "LOCATION_OUT_DIR=$LOCATION_OUT_DIR"
            echo "CES_EXPORT_OUT_DIR=$CES_EXPORT_OUT_DIR"
            echo "LOCATION_DATA_DAYS_REFRESH=$LOCATION_DATA_DAYS_REFRESH"
            echo "CES_CONFIG=$CES_CONFIG"
            [[ -n "${CES_ORG_NAME:-}" ]] && echo "CES_ORG_NAME=$CES_ORG_NAME"
            [[ -n "${CES_SECRETS_DIR:-}" ]] && echo "CES_SECRETS_DIR=$CES_SECRETS_DIR"
            [[ -n "${CURL_RETRIES:-}" ]] && echo "CURL_RETRIES=$CURL_RETRIES"
            [[ -n "${CURL_RETRY_DELAY:-}" ]] && echo "CURL_RETRY_DELAY=$CURL_RETRY_DELAY"
            [[ -n "${CURL_CONNECT_TIMEOUT:-}" ]] && echo "CURL_CONNECT_TIMEOUT=$CURL_CONNECT_TIMEOUT"
            [[ -n "${CURL_MAX_TIME:-}" ]] && echo "CURL_MAX_TIME=$CURL_MAX_TIME"
            [[ -n "${http_proxy:-}" ]] && echo "http_proxy=$http_proxy"
            [[ -n "${https_proxy:-}" ]] && echo "https_proxy=$https_proxy"
            [[ -n "${HTTP_PROXY:-}" ]] && echo "HTTP_PROXY=$HTTP_PROXY"
            [[ -n "${HTTPS_PROXY:-}" ]] && echo "HTTPS_PROXY=$HTTPS_PROXY"
            [[ -n "${NO_PROXY:-}" ]] && echo "NO_PROXY=$NO_PROXY"
          } >> "$GITHUB_ENV"

          echo "data_root=$DATA_ROOT" >> "$GITHUB_OUTPUT"

      - name: Build datasets
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-data.sh

      - name: Generate directory index pages
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" make_index.py "${{ steps.runner_env.outputs.data_root }}"

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: ${{ steps.runner_env.outputs.data_root }}

  deploy:
    needs: build-data
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download data artifact
        uses: actions/download-artifact@v5
        with:
          name: site-data
          path: ./data

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
