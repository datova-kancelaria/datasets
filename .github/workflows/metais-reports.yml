name: Fetch MetaIS reports

on:
  schedule:
# cron:
# minute (0-59)
# hour (0-23)
# day of the month (1-31)
# month (1-12)
# day of the week (0-7 here both 0 and 7 mean Sunday)
# "0 2 * * 0" means 2am (0 min), I don't care what day it falls on, any month, Sundays
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

concurrency:
  group: datasets-pages
  cancel-in-progress: false

jobs:
  build-egov:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas tqdm openpyxl

      - name: Fetch JSON reports
        run: ./fetch-reports.sh

      - name: Convert JSON to CSV
        run: python3 convert.py

      - name: Fetch NUTS datasets
        run: python3 fetch-nuts.py

      - name: Fetch Cloud services
        env:
          API_URI: ${{ secrets.API_URI }}
        run: python3 cloud_services.py

      - name: Output contents of the directory
        run: ./check.sh

      - name: Upload egov artifact
        uses: actions/upload-artifact@v4
        with:
          name: egov-data
          path: ./data/egov

      - name: Upload location artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-data
          path: ./data/location

  build-finance:
    runs-on: [self-hosted, linux, x64, finance-vm]
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build finance data on VM
        run: /home/ubuntu/scripts/run-finance-build.sh "$PWD/data/finance"

      - name: Upload finance artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-data
          path: ./data/finance

  deploy:
    needs: [build-egov, build-finance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download egov artifact
        uses: actions/download-artifact@v5
        with:
          name: egov-data
          path: ./data/egov

      - name: Download finance artifact
        uses: actions/download-artifact@v5
        with:
          name: finance-data
          path: ./data/finance

      - name: Download location artifact
        uses: actions/download-artifact@v5
        with:
          name: location-data
          path: ./data/location

      - name: Generate directory index pages
        run: python3 .github/scripts/make_index.py ./data

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
